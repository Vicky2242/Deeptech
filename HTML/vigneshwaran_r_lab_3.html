<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Attendance Report</title>
</head>
<body>
    <h1>HTML Table Lab Task</h1>
    <table border="1" cellpadding="10" cellspacing="10">
        <caption><b>Monthly Employee Attendance Report</b></caption>
        <tr>
           <th>Employee Name</th>
           <th>Department</th>
           <th>Days Present</th>
           <th>Days Absent</th>
           <th>Remarks</th>
        </tr>
        <tr>
            <td>Arjun</td>
            <td rowspan="2">Sales</td>
            <td>25</td>
            <td>3</td>
            <td>Good</td>
        </tr>
        <tr>
            <td>Kavya</td>
            <td>26</td>
            <td>2</td>
            <td>Excellent</td>
        </tr>
        <tr>
            <td>Priya</td>
            <td>HR</td>
            <td>27</td>
            <td>1</td>
            <td>Excellent</td>
        </tr>
        <tr>
            <td>Karthik</td>
            <td>IT</td>
            <td>22</td>
            <td>6</td>
            <td>Average</td>
        </tr>
        <tr>
            <td>Meena</td>
            <td>IT</td>
            <td>24</td>
            <td>4</td>
            <td>Good</td>
        </tr>
        <tr>
            <td colspan="2"><b>Total Employees:</b> 5</td>
            <td colspan="3"><b>Average Attendance:</b> 24.8</td>
        </tr>
    </table> 
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Ticket Design</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <header>
          🎬 Cinema World
    </header>
    <section>
        <div class="ticket">
            <img width="250" src="./leo.jpg" alt="">
            <h2>🎥 Movie Ticket</h2>
            <p>Movie:<span>Leo</span></p>
            <p>Seat:<span>A12</span></p>
            <p>Date:<span>29 Oct 2025</span></p>
            <p>Show Time:<span>7.30 PM</span></p>
            <p>Venue:<span>PVR Cinemas, Chennai</span></p>
        </div>
    </section>

    <footer>
        <p>© 2025 Cinema World | Designed by Students.</p>
    </footer>
</body>
</html>

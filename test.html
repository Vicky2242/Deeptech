<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onmouseover="changeColor()" onmouseout="resetColor()" 
id="myBtn">Hover Me</button> 

</body>

<script> 
function changeColor(){ 
document.getElementById("myBtn").style.backgroundColor = "lightgreen"; 
} 
function resetColor(){ 
document.getElementById("myBtn").style.backgroundColor = ""; 
} 
</script> 
</html>
